# Builds CompCue Link on Linux, Windows and macOS: the helper (Rust, helper/) is checked against the site's contract
# (cargo test, helper/contract.json) and the real executable is run against a fake League client and a fake site on
# each (test/smoke.mjs). On Windows the tray program is built with the helper inside it, opened like a download
# (it sets itself up, connects, updates itself from a release on the runner, removes itself) and the Microsoft Store
# package is installed and removed. On macOS the app is installed with mac/install.sh and removed again.
# A v* tag pushed by a maintainer, or a maintainer running this workflow by hand on main with "release" ticked,
# turns the same files into a release named after the version in package.json.
name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release for the version in package.json"
        type: boolean
        default: false
# least privilege: building needs to read the code and nothing else
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts
      - name: One version everywhere
        run: |
          set -euo pipefail
          A=$(node -p "require('./package.json').version"); B=$(sed -n 's/^version = "\(.*\)"/\1/p' helper/Cargo.toml | head -1)
          test "$A" = "$B" || { echo "package.json says $A, helper/Cargo.toml says $B"; exit 1; }
      - run: cargo test --locked --manifest-path helper/Cargo.toml
      - run: cargo build --release --locked --manifest-path helper/Cargo.toml
      - run: node test/smoke.mjs helper/target/release/compcue-link

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts
      - run: cargo test --locked --manifest-path helper/Cargo.toml
      - run: cargo build --release --locked --manifest-path helper/Cargo.toml
      - run: node test/smoke.mjs helper/target/release/compcue-link.exe
        shell: bash
      - name: Check that the helper has no console
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $b = [IO.File]::ReadAllBytes("$PWD\helper\target\release\compcue-link.exe")
          $pe = [BitConverter]::ToInt32($b, 0x3C)
          $subsystem = [BitConverter]::ToUInt16($b, $pe + 24 + 68)
          if ($subsystem -ne 2) { throw "subsystem ${subsystem}: expected 2 (Windows GUI, no console)" }
          "subsystem $subsystem (no console), $([Math]::Round($b.Length / 1MB, 1)) MB"
      - name: Build the tray program (the helper inside it) and the Microsoft Store package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $plain = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $v = $plain.Split('.')
          New-Item -ItemType Directory -Force dist, pkg\assets, zip\CompCueLink | Out-Null
          Copy-Item helper\target\release\compcue-link.exe pkg\compcue-link.exe
          "[assembly: System.Reflection.AssemblyVersion(`"$plain.0`")]" | Set-Content build-Version.cs
          # one file to run: CompCueLink.exe, with the helper inside it
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /optimize /target:winexe /out:dist\CompCueLink.exe /resource:pkg\compcue-link.exe,compcue-link.exe /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.Web.Extensions.dll windows\CompCueLink.cs build-Version.cs
          if ($LASTEXITCODE) { throw "the tray app did not compile" }
          Get-Item dist\CompCueLink.exe | Format-List Name, Length
          # copies of 0.4.4 update from a zip with these two names in it: kept so they can move to this version
          Copy-Item dist\CompCueLink.exe, pkg\compcue-link.exe zip\CompCueLink\
          "Open CompCueLink.exe (the other file is its helper). A tray icon next to the clock shows the state." | Set-Content zip\CompCueLink\README.txt
          Compress-Archive -Path zip\CompCueLink\* -DestinationPath dist\CompCueLink-windows.zip -Force

          # the Store does not take a version that starts with 0: 0.1.0 here is 1.1.0.0 there
          $version = "$([int]$v[0] + 1).$($v[1]).$($v[2]).0"
          Copy-Item dist\CompCueLink.exe pkg\CompCueLink.exe
          Copy-Item windows\assets\*.png pkg\assets\
          $manifest = [IO.File]::ReadAllText("$PWD\windows\AppxManifest.xml").Replace('__VERSION__', $version)
          [IO.File]::WriteAllText("$PWD\pkg\AppxManifest.xml", $manifest, (New-Object Text.UTF8Encoding $false))
          $kit = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\makeappx.exe" | Sort-Object FullName | Select-Object -Last 1
          & $kit.FullName pack /d pkg /p dist\CompCueLink-store.msix /o
          if ($LASTEXITCODE) { throw "the package was not made" }
          "KIT=$($kit.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-Item dist\CompCueLink-store.msix | Format-List Name, Length
      - name: Install the package like the Store would, connect with the site's button, then uninstall
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # the Store signs the real package; here a copy is signed with a throwaway certificate this machine trusts
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=C0C79070-CFDD-40D9-8E94-882E2FE66BC3" -KeyUsage DigitalSignature -CertStoreLocation "Cert:\CurrentUser\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          Export-Certificate -Cert $cert -FilePath "$env:RUNNER_TEMP\test.cer" | Out-Null
          Import-Certificate -FilePath "$env:RUNNER_TEMP\test.cer" -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          Copy-Item dist\CompCueLink-store.msix "$env:RUNNER_TEMP\test.msix"
          & "$env:KIT\signtool.exe" sign /fd SHA256 /sha1 $cert.Thumbprint "$env:RUNNER_TEMP\test.msix"
          if ($LASTEXITCODE) { throw "signing the test copy failed" }
          Add-AppxPackage -Path "$env:RUNNER_TEMP\test.msix"
          $pkg = Get-AppxPackage AndrsLince.CompCueLink
          if (-not $pkg) { throw "the package is not installed" }
          "installed $($pkg.PackageFullName)"

          # a fake League client where the app looks by itself, and a fake site
          $F = "$env:RUNNER_TEMP\fakes"
          $env:SMOKE_LEAGUE_DIR = "C:\Riot Games\League of Legends"
          New-Item -ItemType Directory -Force $env:SMOKE_LEAGUE_DIR | Out-Null
          $env:PATH += ";C:\Program Files\Git\usr\bin"
          Start-Process node -ArgumentList "test/smoke.mjs", "--serve", "`"$F`"" -WindowStyle Hidden
          foreach ($i in 1..40) { if (Test-Path "$F\ports.json") { break }; Start-Sleep -Milliseconds 500 }
          $ports = Get-Content "$F\ports.json" -Raw | ConvertFrom-Json

          # what the site's "Connect this PC" button does
          Start-Process "compcue-link:setup?key=$($ports.key)&site=$([uri]::EscapeDataString($ports.siteUrl))"
          $seen = $null
          foreach ($i in 1..60) {
            Start-Sleep -Seconds 1
            try { $seen = Get-Content "$F\seen.json" -Raw | ConvertFrom-Json } catch { continue }
            if ($seen.claimed -eq 1 -and $seen.problems.Count -eq 0) { break }
          }
          "--- processes"; Get-Process CompCueLink, compcue-link -ErrorAction SilentlyContinue | Format-Table Name, Id, Path
          "--- the helper's files"
          $dirs = @("$env:APPDATA\CompCue", "$env:LOCALAPPDATA\Packages\$($pkg.PackageFamilyName)\LocalCache\Roaming\CompCue") | Where-Object { Test-Path $_ }
          foreach ($d in $dirs) { $d; Get-ChildItem $d | Format-Table Name, Length; if (Test-Path "$d\status.json") { Get-Content "$d\status.json" }; if (Test-Path "$d\link.log") { Get-Content "$d\link.log" } }
          "--- seen by the fake site"; $seen | ConvertTo-Json -Depth 4 -Compress | ForEach-Object { $_.Substring(0, [Math]::Min(600, $_.Length)) }
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [Windows.Forms.Screen]::PrimaryScreen.Bounds; $bmp = New-Object Drawing.Bitmap $b.Width, $b.Height
            [Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [Drawing.Point]::Empty, $b.Size); $bmp.Save("$env:RUNNER_TEMP\windows-screen.png")
          } catch { "no screenshot: $_" }
          if (-not $seen -or $seen.claimed -ne 1 -or $seen.started -ne 0) { throw "the app did not connect with the one-time key" }
          if ($seen.problems.Count -ne 0) { throw "these did not hold: $($seen.problems -join '; ')" }
          if ($seen.writes -ne 0) { throw "the helper wrote to the client" }
          if (-not (Get-Process CompCueLink -ErrorAction SilentlyContinue)) { throw "the tray app is not running" }
          "connected through the installed package: one-time key, reads, refusals, nothing secret, zero writes"

          Get-AppxPackage AndrsLince.CompCueLink | Remove-AppxPackage
          Start-Sleep -Seconds 2
          if (Get-Process CompCueLink, compcue-link -ErrorAction SilentlyContinue) { throw "still running after uninstall" }
          if (Get-AppxPackage AndrsLince.CompCueLink) { throw "still installed" }
          if (Test-Path "$env:LOCALAPPDATA\Packages\$($pkg.PackageFamilyName)") { "note: the package's data folder is still there" } else { "uninstall left nothing" }
      - name: "Open the download like a player would: it sets itself up, connects, updates itself, and can be removed"
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Home2 = "$env:LOCALAPPDATA\CompCue"; $Data = "$env:APPDATA\CompCue"
          Remove-Item $Home2, $Data -Recurse -Force -ErrorAction SilentlyContinue
          # a 0.4.4 copy updates by putting the zip's two files in its folder and opening CompCueLink.exe there: the same start
          $X = "$env:RUNNER_TEMP\Downloads\CompCueLink-windows"; Expand-Archive dist\CompCueLink-windows.zip $X -Force
          $F = "$env:RUNNER_TEMP\fakes2"
          $env:SMOKE_LEAGUE_DIR = "C:\Riot Games\League of Legends"
          New-Item -ItemType Directory -Force $env:SMOKE_LEAGUE_DIR | Out-Null
          $env:PATH += ";C:\Program Files\Git\usr\bin"
          Start-Process node -ArgumentList "test/smoke.mjs", "--serve", "`"$F`"" -WindowStyle Hidden
          foreach ($i in 1..40) { if (Test-Path "$F\ports.json") { break }; Start-Sleep -Milliseconds 500 }
          $ports = Get-Content "$F\ports.json" -Raw | ConvertFrom-Json
          # the helper the tray starts talks to the fake site (it reads COMPCUE_SITE), as a real copy talks to compcue.aflince.com
          $env:COMPCUE_SITE = $ports.siteUrl
          function Running { @(Get-Process CompCueLink, compcue-link -ErrorAction SilentlyContinue) }
          function Show { Running | Format-Table Name, Id, Path; if (Test-Path "$Data\link.log") { Get-Content "$Data\link.log" | Select-Object -Last 15 } }
          function Wait-Status($want) { foreach ($i in 1..40) { Start-Sleep -Seconds 1; try { $s = Get-Content "$Data\status.json" -Raw | ConvertFrom-Json; if ($s.state -eq $want -and (Get-Process -Id $s.pid -ErrorAction SilentlyContinue)) { return $s } } catch { } }; Show; throw "the helper did not reach '$want'" }
          function Say-Update($s) { $s | Add-Member update "9.9.9" -Force; [IO.File]::WriteAllText("$Data\status.json", ($s | ConvertTo-Json -Compress)) }

          Start-Process "$X\CompCueLink.exe"
          $s = Wait-Status "connected"
          Show
          $tray = @(Get-Process CompCueLink)
          if ($tray.Count -ne 1 -or $tray[0].Path -ne "$Home2\CompCueLink.exe") { throw "it should run once, from its own folder ($Home2)" }
          if ((Get-Process -Id $s.pid).Path -ne "$Home2\compcue-link.exe") { throw "the helper should run from its own folder" }
          if ((Get-FileHash "$Home2\compcue-link.exe").Hash -ne (Get-FileHash helper\target\release\compcue-link.exe).Hash) { throw "the helper it carries is not the one that was built" }
          if ((Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run").CompCueLink -ne "`"$Home2\CompCueLink.exe`"") { throw "it does not start with Windows from its own folder" }
          if ((Get-ItemProperty "HKCU:\Software\Classes\compcue-link\shell\open\command").'(default)' -notlike "`"$Home2\CompCueLink.exe`"*") { throw "the site's button is not registered" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\CompCue Link.lnk")) { throw "no Start menu entry" }
          foreach ($i in 1..20) { try { $seen = Get-Content "$F\seen.json" -Raw | ConvertFrom-Json } catch { }; if ($seen -and $seen.problems.Count -eq 0) { break }; Start-Sleep -Seconds 1 }
          if ($seen.problems.Count -ne 0) { throw "these did not hold: $($seen.problems -join '; ')" }
          if ($seen.writes -ne 0) { throw "the helper wrote to the client" }
          "opened from a download folder: set itself up, paired, reads, refusals, zero writes"

          # opening the download again changes nothing (the same version is already there and running)
          Start-Process "$X\CompCueLink.exe"; Start-Sleep -Seconds 3
          Get-Process CompCueLink -ErrorAction SilentlyContinue | Where-Object { $_.Id -ne $tray[0].Id } | Stop-Process -Force   # the "already running" note
          if (-not (Get-Process -Id $tray[0].Id -ErrorAction SilentlyContinue) -or -not (Get-Process -Id $s.pid -ErrorAction SilentlyContinue)) { throw "opening it twice disturbed the running copy" }

          # ---- an update: a release on this computer (the only stand-in the app accepts), League closed
          $R = "$env:RUNNER_TEMP\release"; New-Item -ItemType Directory -Force "$R\v9.9.9" | Out-Null
          Copy-Item dist\CompCueLink.exe "$R\v9.9.9\"
          $bad = "0" * 64
          "$bad  CompCueLink.exe" | Set-Content "$R\v9.9.9\SHA256SUMS" -Encoding ascii
          Start-Process python -ArgumentList "-m", "http.server", "8765", "--bind", "127.0.0.1", "--directory", "`"$R`"" -WindowStyle Hidden
          # wait until the stand-in release answers: the tray asks once and then waits before asking again
          foreach ($i in 1..40) { try { Invoke-WebRequest "http://127.0.0.1:8765/v9.9.9/SHA256SUMS" -UseBasicParsing | Out-Null; break } catch { Start-Sleep -Milliseconds 500 } }
          Running | Stop-Process -Force
          Start-Sleep -Seconds 1
          Remove-Item "$env:SMOKE_LEAGUE_DIR\lockfile" -Force     # League is closed
          $env:COMPCUE_RELEASES = "http://127.0.0.1:8765"
          Start-Process "$Home2\CompCueLink.exe"
          $s = Wait-Status "waiting"
          $tray = (Get-Process CompCueLink).Id; $helper = $s.pid
          $before = (Get-FileHash "$Home2\CompCueLink.exe").Hash

          # 1. a download that does not match the release's checksum is not installed
          Say-Update $s
          foreach ($i in 1..30) { Start-Sleep -Seconds 1; if (Select-String -Path "$Data\link.log" -Pattern "does not match" -Quiet) { break } }
          if (-not (Select-String -Path "$Data\link.log" -Pattern "does not match" -Quiet)) { Show; throw "a bad download was not refused" }
          if ((Get-Process CompCueLink).Id -ne $tray -or -not (Get-Process -Id $helper -ErrorAction SilentlyContinue)) { throw "a refused update disturbed the running copy" }
          if (Test-Path "$Home2\CompCueLink.old.exe") { throw "a refused update touched the program files" }
          "a download with the wrong checksum was refused"

          # 2. the real one goes in: new tray, new helper, working again
          Running | Stop-Process -Force
          "$((Get-FileHash "$R\v9.9.9\CompCueLink.exe").Hash.ToLower())  CompCueLink.exe" | Set-Content "$R\v9.9.9\SHA256SUMS" -Encoding ascii
          Start-Sleep -Seconds 1
          Start-Process "$Home2\CompCueLink.exe"
          $s = Wait-Status "waiting"
          $tray = (Get-Process CompCueLink).Id; $helper = $s.pid
          Say-Update $s
          foreach ($i in 1..60) { Start-Sleep -Seconds 1; if (Select-String -Path "$Data\link.log" -Pattern "Updated to 9.9.9" -Quiet) { break } }
          Start-Sleep -Seconds 6
          Show; Get-ChildItem $Home2 | Format-Table Name, Length
          if (-not (Select-String -Path "$Data\link.log" -Pattern "Updated to 9.9.9" -Quiet)) { throw "the update did not go in" }
          $now = @(Get-Process CompCueLink -ErrorAction SilentlyContinue)
          if ($now.Count -ne 1 -or $now[0].Id -eq $tray) { throw "after the update there should be one new tray app (found $($now.Count))" }
          $s = Wait-Status "waiting"
          if ($s.pid -eq $helper) { throw "the helper was not restarted" }
          if ($s.update) { throw "the new copy still thinks an update is waiting" }
          if ((Get-FileHash "$Home2\CompCueLink.exe").Hash -ne $before) { throw "the program file is not the release's" }
          "updated itself from a release, checked, and came back up"

          # ---- and it can be removed again
          Start-Process "$Home2\CompCueLink.exe" -ArgumentList "--remove" -Wait
          Start-Sleep -Seconds 8
          if (Running) { Show; throw "still running after removing it" }
          if (Test-Path $Home2) { Get-ChildItem $Home2; throw "its folder is still there" }
          if (Test-Path $Data) { throw "its data (the token) is still there" }
          if ((Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run").CompCueLink) { throw "it would still start with Windows" }
          if (Test-Path "HKCU:\Software\Classes\compcue-link") { throw "the site's button is still registered" }
          if (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\CompCue Link.lnk") { throw "the Start menu entry is still there" }
          "removed: nothing left"
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: "dist/CompCueLink.exe\ndist/CompCueLink-windows.zip" }
      # the file to upload in Partner Center (unsigned on purpose: the Store signs it)
      - uses: actions/upload-artifact@v4
        with: { name: windows-store, path: dist/CompCueLink-store.msix }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: windows-screenshot, path: "${{ runner.temp }}/windows-screen.png", if-no-files-found: ignore }

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: cargo test --locked --manifest-path helper/Cargo.toml
      - name: Build the app for Apple silicon and Intel
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist
          for ARCH in arm64 x64; do
            if [ "$ARCH" = arm64 ]; then SWIFT=arm64; RUST=aarch64; else SWIFT=x86_64; RUST=x86_64; fi
            APP="build/$ARCH/CompCue Link.app"
            mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
            cargo build --release --locked --manifest-path helper/Cargo.toml --target $RUST-apple-darwin
            cp helper/target/$RUST-apple-darwin/release/compcue-link "$APP/Contents/MacOS/compcue-link"
            swiftc -O -target $SWIFT-apple-macos12.0 mac/CompCueLink.swift -o "$APP/Contents/MacOS/CompCueLink"
            sed "s/__VERSION__/$VERSION/g" mac/Info.plist > "$APP/Contents/Info.plist"
            # ad-hoc signature: every Mac needs one to run the code at all (it is not Apple notarization)
            codesign --force --sign - "$APP/Contents/MacOS/compcue-link"
            codesign --force --sign - "$APP"
            codesign --verify --deep --strict "$APP"
            ditto -c -k --keepParent "$APP" "dist/CompCueLink-mac-$ARCH.zip"
          done
          ls -la dist
      - name: Smoke test the helper (Apple silicon, and Intel through Rosetta when it is there)
        run: |
          node test/smoke.mjs "build/arm64/CompCue Link.app/Contents/MacOS/compcue-link"
          if arch -x86_64 /usr/bin/true 2>/dev/null; then node test/smoke.mjs "build/x64/CompCue Link.app/Contents/MacOS/compcue-link"; else echo "no Rosetta here: Intel build not run"; fi
      - name: Install with mac/install.sh, check it connects, then uninstall
        run: |
          set -euo pipefail
          F="$RUNNER_TEMP/fakes"
          node test/smoke.mjs --serve "$F" &
          for i in $(seq 1 40); do [ -f "$F/ports.json" ] && break; sleep 0.5; done
          SITE=$(node -p "require('$F/ports.json').siteUrl"); KEY=$(node -p "require('$F/ports.json').key"); LEAGUE=$(node -p "require('$F/ports.json').league")
          # the app is started by the system, not by this shell: give the fake client's folder to everything it starts
          launchctl setenv LEAGUE_PATH "$LEAGUE"; launchctl setenv COMPCUE_NO_UPDATE 1; launchctl setenv COMPCUE_NO_BROWSER 1
          (cd dist && shasum -a 256 CompCueLink-mac-*.zip > SHA256SUMS && python3 -m http.server 8911 >/dev/null 2>&1 &)
          # wait until the local release server answers (a fixed 1 s was too short on a slow runner)
          for i in $(seq 1 40); do curl -fsS -o /dev/null http://127.0.0.1:8911/SHA256SUMS && break; sleep 0.5; done
          COMPCUE_RELEASE_URL=http://127.0.0.1:8911 sh mac/install.sh "$KEY" "$SITE"
          S="$HOME/Library/Application Support/CompCue"
          for i in $(seq 1 40); do grep -q '"state":"connected"' "$S/status.json" 2>/dev/null && break; sleep 1; done
          # the first champ select event follows the connection by a moment: wait for the fake site to have seen it all
          for i in $(seq 1 20); do node -e "process.exit(require('fs').readFileSync('$F/seen.json','utf8').includes('\"problems\":[]') ? 0 : 1)" 2>/dev/null && break; sleep 1; done
          echo "--- status"; cat "$S/status.json" || true; echo; echo "--- log"; cat "$S/link.log" || true
          echo "--- seen by the fake site"; node -e "const s=require('$F/seen.json'); console.log(JSON.stringify({claimed:s.claimed, started:s.started, hello:s.hello, clientUp:s.clientUp, writes:s.writes, problems:s.problems}, null, 1)); if (s.problems.length || s.claimed !== 1 || s.started !== 0) process.exit(1)"
          test -d "$HOME/Applications/CompCue Link.app"
          pgrep -x CompCueLink >/dev/null && echo "menu bar app is running"
          pgrep -x compcue-link >/dev/null && echo "helper is running"
          grep -q '"state":"connected"' "$S/status.json"
          plutil -lint "$HOME/Library/LaunchAgents/com.compcue.link.plist"
          test "$(stat -f %Lp "$S/link.json")" = 600 && echo "token file is private"
          screencapture -x "$RUNNER_TEMP/menubar.png" || true
          # a good update replaces the app, restarts it, and it connects again with the same pairing
          COMPCUE_RELEASE_URL=http://127.0.0.1:8911 sh mac/install.sh --update
          sleep 2
          for i in $(seq 1 40); do grep -q '"state":"connected"' "$S/status.json" 2>/dev/null && pgrep -x CompCueLink >/dev/null && break; sleep 1; done
          pgrep -x CompCueLink >/dev/null && grep -q '"state":"connected"' "$S/status.json" && echo "update applied, app running and connected"
          # a tampered download must be refused and leave the installed app alone
          echo tampered >> dist/CompCueLink-mac-arm64.zip; echo tampered >> dist/CompCueLink-mac-x64.zip
          if COMPCUE_RELEASE_URL=http://127.0.0.1:8911 sh mac/install.sh --update; then echo "a tampered download was accepted"; exit 1; fi
          test -d "$HOME/Applications/CompCue Link.app" && pgrep -x CompCueLink >/dev/null && echo "tampered update refused, app untouched"
          sh mac/uninstall.sh
          sleep 1
          if pgrep -x CompCueLink || pgrep -x compcue-link; then echo "still running after uninstall"; exit 1; fi
          test ! -e "$HOME/Applications/CompCue Link.app" && test ! -e "$S" && test ! -e "$HOME/Library/LaunchAgents/com.compcue.link.plist" && echo "uninstall left nothing"
      - name: Rebuild the zips the tamper check changed
        run: |
          for ARCH in arm64 x64; do rm "dist/CompCueLink-mac-$ARCH.zip"; ditto -c -k --keepParent "build/$ARCH/CompCue Link.app" "dist/CompCueLink-mac-$ARCH.zip"; done
          rm -f dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with: { name: mac, path: "dist/CompCueLink-mac-*.zip" }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: mac-screenshot, path: "${{ runner.temp }}/menubar.png", if-no-files-found: ignore }

  # only a v* tag pushed by a maintainer can write a release, and it uses GitHub's own CLI (no third-party action)
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main')
    needs: [linux, windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true, pattern: "{windows,mac}" }
      - name: Checksums, version file and the Mac installer
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          case "$REF" in refs/tags/*) test "v$VERSION" = "$TAG" || { echo "tag $TAG does not match version $VERSION"; exit 1; } ;; esac
          cp mac/install.sh mac/uninstall.sh dist/
          echo "{\"version\":\"$VERSION\"}" > dist/version.json
          cd dist && sha256sum CompCueLink-mac-*.zip CompCueLink.exe CompCueLink-windows.zip install.sh uninstall.sh > SHA256SUMS && ls -la
        env: { TAG: "${{ github.ref_name }}", REF: "${{ github.ref }}" }
      - run: |
          V="v$(node -p "require('./package.json').version")"
          gh release create "$V" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "CompCue Link $V" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
